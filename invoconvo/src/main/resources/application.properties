spring.application.name=Sundaram

# ============================================================
# MYSQL DATABASE
# Change username / password to match YOUR MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sundaram_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=SundaramSecretKeyForJWTTokenGenerationMustBeLongEnough1234567890
jwt.expiration=86400000

# App - Sundaram Skincare
app.company.name=Sundaram
app.company.email=hello@sundaram.care
app.company.phone=+91 98765 43210
app.company.address=42, Heritage Lane, Fort Kochi, Kerala 682001
app.company.tagline=Rooted in Ritual. Crafted for Skin.