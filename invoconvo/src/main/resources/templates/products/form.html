<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Sundaram</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside class="sidebar">
    <div class="brand">SUNDARAM</div>
    <div class="brand-sub">Skincare Studio</div>
    <nav>
        <a th:href="@{/dashboard}"><span>◈</span> <span>Dashboard</span></a>
        <a th:href="@{/invoices}"><span>◈</span> <span>Invoices</span></a>
        <a th:href="@{/customers}"><span>◈</span> <span>Customers</span></a>
        <a th:href="@{/products}" class="active"><span>◈</span> <span>Products</span></a>
        <a th:href="@{/swagger-ui.html}" target="_blank"><span>◈</span> <span>API Docs</span></a>
    </nav>
    <div class="logout"><a th:href="@{/logout}"><span>◈</span> <span>Sign Out</span></a></div>
</aside>
<main class="main">
    <div class="page-header">
        <h1 th:text="${product.id != null ? 'Edit Product' : 'New Product'}">Product</h1>
    </div>
    <form th:action="@{/products}" method="post" th:object="${product}" class="form-card">
        <input type="hidden" th:field="*{id}">
        <div class="form-grid">
            <div class="form-group"><label>Name *</label><input th:field="*{name}" required placeholder="e.g. Ruchi Haldi Face Mask"></div>
            <div class="form-group"><label>Unit Price (₹) *</label><input type="number" step="0.01" min="0" th:field="*{unitPrice}" required></div>
            <div class="form-group full"><label>Description</label><textarea th:field="*{description}" rows="2"></textarea></div>
            <div class="form-group"><label>Tax Rate %</label><input type="number" step="0.01" min="0" th:field="*{taxRate}" value="12"></div>
            <div class="form-group"><label>Unit</label><input th:field="*{unit}" placeholder="jar, bottle, piece..."></div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
